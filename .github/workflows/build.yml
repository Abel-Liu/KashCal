name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare debug signing key
      if: github.event_name == 'workflow_dispatch'
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
          echo "::error::Set the DEBUG_KEYSTORE_BASE64 repository secret before running a manual APK build."
          exit 1
        fi
        umask 077
        printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kashcal-debug.keystore"

    - name: Build signed debug APK
      if: github.event_name == 'workflow_dispatch'
      env:
        DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/kashcal-debug.keystore
        DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
      run: ./gradlew assembleDebug --no-daemon

    - name: Clean up debug signing key
      if: always() && github.event_name == 'workflow_dispatch'
      run: rm -f "$RUNNER_TEMP/kashcal-debug.keystore"

    - name: Build debug APK for PR checks
      if: github.event_name == 'pull_request'
      run: ./gradlew assembleDebug --no-daemon

    - name: Rename debug APK
      if: github.event_name == 'workflow_dispatch'
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/KashCal.apk

    - name: Upload debug APK
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: KashCal-debug
        path: app/build/outputs/apk/debug/KashCal.apk
        if-no-files-found: error

    - name: Run unit tests
      if: github.event_name == 'pull_request'
      run: ./gradlew testDebugUnitTest --no-daemon

    # Visual-regression gate: renders covered UI on the JVM (Robolectric native
    # graphics) and compares against committed goldens. Non-blocking for now
    # (continue-on-error) until the first runs confirm this ubuntu-latest runner
    # matches the goldens recorded on Linux x86_64 within the comparison
    # threshold; flip to blocking once that cross-host delta is confirmed.
    # cleanTestDebugUnitTest + --no-build-cache force the test task to actually
    # execute (compile stays up-to-date) — otherwise Gradle could restore a
    # cached result and the visual assertion would never run.
    - name: Verify screenshots (visual regression)
      if: github.event_name == 'pull_request'
      id: screenshot_verify
      run: ./gradlew cleanTestDebugUnitTest testDebugUnitTest --tests "*Screenshot*" -Proborazzi.test.verify=true --no-build-cache --no-daemon
      continue-on-error: true

    - name: Upload screenshot diffs
      if: steps.screenshot_verify.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-diffs
        path: app/build/outputs/roborazzi/
        retention-days: 7

    - name: Upload test results
      if: failure() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/

  android-lint:
    name: Android Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
